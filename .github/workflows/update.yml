name: Update M3U Stream

on:
  schedule:
    - cron: '*/30 * * * *' # Her 30 dakikada bir otomatik çalışır
  workflow_dispatch: # Manuel tetikleme butonu da olsun

jobs:
  update-stream:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Git commit atabilmek için yetki

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run extraction script
        run: python update.py

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add channel.m3u
          git diff --staged --quiet || (git commit -m "Auto-update m3u8 stream token" && git push)
